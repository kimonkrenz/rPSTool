name: CRAN readiness (Linux only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cran-readiness-linux
  cancel-in-progress: true

jobs:
  cran-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: "yes"
      MAKEFLAGS: "-j2"
      RPST_FULL_TESTS: "false"
      _R_CHECK_CRAN_INCOMING_: "true"
      _R_CHECK_FORCE_SUGGESTS_: "false"
      _R_CHECK_LIMIT_CORES_: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: any::knitr, any::rmarkdown, any::testthat
          needs: check
          cache: true
      - name: Verify pinned vendor inventory
        run: Rscript tools/verify-vendor.R
      - name: Build source package and run unfiltered CRAN-style check
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .local/cran-readiness
          R CMD build --no-manual . 2>&1 | tee .local/cran-readiness/build.log
          tarball="$(find . -maxdepth 1 -name 'rPSTool_*.tar.gz' -print -quit)"
          test -n "$tarball"
          R CMD check --as-cran --no-manual "$tarball" 2>&1 | tee .local/cran-readiness/check.log
      - name: Preserve CRAN diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cran-readiness-linux-logs
          path: |
            .local/cran-readiness/
            rPSTool.Rcheck/00check.log
            rPSTool.Rcheck/00install.out
            rPSTool.Rcheck/tests/
          if-no-files-found: ignore
          retention-days: 7
