name: Linux release candidate

# Manual only. Full Linux development validation (all test cases, arrow installed), a separate
# R CMD check --as-cran with CRAN incoming checks enabled, and install/registration/URL checks.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-release-candidate
  cancel-in-progress: false

env:
  GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
  R_KEEP_PKG_SOURCE: "yes"
  MAKEFLAGS: "-j2"
  RPST_FULL_TESTS: "true"

jobs:
  full-gate:
    name: Full development gate (RPST_FULL_TESTS=true, arrow)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"all"'
          extra-packages: any::rcmdcheck
      - name: Record commit and environment
        id: env
        run: |
          mkdir -p .local/rc
          { echo "commit: $(git rev-parse HEAD)"; echo "runner: ${{ runner.os }} ${{ runner.arch }} $ImageOS $ImageVersion"; R --version | head -1; gcc --version | head -1; g++ --version | head -1;
            Rscript -e 'for (p in c("arrow","sf","testthat","jsonlite","ggplot2","classInt","knitr","rmarkdown")) cat(p, as.character(packageVersion(p)), "\n")'; } | tee .local/rc/environment.txt
          Rscript -e 'stopifnot(packageVersion("arrow") >= "25.0.0", requireNamespace("arrow", quietly = TRUE))'
      - name: Verify pinned vendor trees and provenance
        id: vendor
        run: |
          for t in verify-vendor verify-flatgeobuf-vendor verify-arrow-abi; do
            echo "::group::$t"; Rscript tools/$t.R; echo "::endgroup::"
          done
      - name: Build-time fail-closed tool tests and historical-fixture regression suite
        id: tools
        shell: bash
        run: |
          {
          for t in test-portability test-graph-constructors test-network-construction test-isovist-safety test-raster-safety \
                   test-diagnostic-fixes test-worker-limits test-fs-layer test-fp-policy test-flatgeobuf-vendor test-arrow-abi \
                   test-checkout-attributes test-build-lifecycle; do
            echo "::group::$t"; Rscript tools/$t.R; echo "::endgroup::"
          done
          echo "::group::warning-policy regression suite (historical fixtures)"
          Rscript tools/ci/test-warning-policy.R
          echo "::endgroup::"
          } 2>&1 | tee .local/rc/tool-tests.log
      - name: Full gate (live R CMD check, tools/ci/check-package.R)
        id: gate
        shell: bash
        run: Rscript tools/ci/run-with-annotations.R tools/ci/check-package.R ubuntu 2>&1 | tee .local/rc/gate.log
      - name: Job summary
        if: always()
        env:
          STEP_ENV: ${{ steps.env.outcome }}
          STEP_VENDOR: ${{ steps.vendor.outcome }}
          STEP_TOOLS: ${{ steps.tools.outcome }}
          STEP_GATE: ${{ steps.gate.outcome }}
        run: Rscript tools/ci/write-summary.R "Linux full development gate"
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-gate-logs
          path: |
            .local/rc
            .local/ci-check
          if-no-files-found: warn
          retention-days: 30

  cran-incoming:
    name: R CMD check --as-cran with CRAN incoming checks
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      _R_CHECK_CRAN_INCOMING_: "true"
      _R_CHECK_CRAN_INCOMING_REMOTE_: "true"
      _R_CHECK_FORCE_SUGGESTS_: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Install manual-building tools (TeX subset, texinfo, HTML tidy)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends texinfo tidy lmodern texlive-latex-base texlive-latex-recommended \
            texlive-latex-extra texlive-fonts-recommended
          # inconsolata.sty (required by R's Rd.sty) is only packaged in the very large texlive-fonts-extra; install just that
          # package from its CTAN TDS archive into the user texmf tree.
          mkdir -p "$HOME/texmf" && cd "$RUNNER_TEMP"
          curl -fsSLO https://mirrors.ctan.org/install/fonts/inconsolata.tds.zip
          unzip -q -o inconsolata.tds.zip -d "$HOME/texmf"
          texhash "$HOME/texmf"
          updmap-user --enable Map=zi4.map
          kpsewhich inconsolata.sty zi4.sty
          command -v pdflatex tidy texi2dvi
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"all"'
          extra-packages: any::rcmdcheck
      - name: Build and check (logs preserved, failures reported at the end)
        shell: bash
        run: |
          mkdir -p .local/cran
          echo "commit: $(git rev-parse HEAD)" | tee .local/cran/commit.txt
          R CMD build . 2>&1 | tee .local/cran/build.log
          tarball="$(ls rPSTool_*.tar.gz)"
          set +e
          R CMD check --as-cran "$tarball" 2>&1 | tee .local/cran/check.log
          echo "check_status=${PIPESTATUS[0]}" | tee .local/cran/status.txt
          cp -r rPSTool.Rcheck .local/cran/ 2>/dev/null || true
          grep -E "warning:|Warning:" rPSTool.Rcheck/00install.out > .local/cran/compiler-diagnostics.txt || true
          wc -l .local/cran/compiler-diagnostics.txt
      - name: Install tarball, load package, check native registration
        run: |
          mkdir -p "$RUNNER_TEMP/lib"
          R CMD INSTALL --library="$RUNNER_TEMP/lib" rPSTool_*.tar.gz
          Rscript -e 'library(rPSTool, lib.loc = Sys.getenv("RUNNER_TEMP") |> file.path("lib")); r <- getDLLRegisteredRoutines("rPSTool"); n <- length(r$.Call); cat("registered .Call routines:", n, "\n"); stopifnot(n > 0)'
      - name: Check public URLs
        run: |
          for u in https://github.com/kimonkrenz/rPSTool https://github.com/kimonkrenz/rPSTool/issues; do
            printf '%s ' "$u"; curl -sS -o /dev/null -w '%{http_code}\n' -L "$u"
          done | tee .local/cran/urls.txt
      - name: Job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Linux R CMD check --as-cran (CRAN incoming checks): $(grep -h '^Status:' .local/cran/check.log 2>/dev/null | tail -1 || true)"
            echo
            echo "| Item | Value |"; echo "|---|---|"
            echo "| Commit | \`$(cat .local/cran/commit.txt 2>/dev/null | sed 's/^commit: //')\` |"
            echo "| \`R CMD check\` exit status | $(sed 's/^check_status=//' .local/cran/status.txt 2>/dev/null || echo 'not recorded') |"
            echo "| Compiler diagnostic lines | $(wc -l < .local/cran/compiler-diagnostics.txt 2>/dev/null || echo 'not recorded') |"
            echo
            echo "Notes and warnings reported by the check:"
            echo '```'
            grep -hE '^\* checking .*(NOTE|WARNING|ERROR)$' .local/cran/check.log 2>/dev/null | head -20 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cran-incoming-logs
          path: .local/cran
          if-no-files-found: warn
          retention-days: 30
